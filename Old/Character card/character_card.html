<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link rel="stylesheet" href="character_card.css">
    <script src="character_card.js" defer></script>
</head>
<body>
    <div class="card">
        <img class="image" src="snortleblat.webp" alt="snortleblat">
        <div class="name">Snortleblat</div>
        <div class="stats">
            <p>Class: </p>
            <p>Interior Crocodile Alligator</p>
            <p>Level:</p>
            <p id="level">8</p>
            <p>Health:</p>
            <p id="health">100</p>
        </div>
        <button id="attackButton">Attack</button>
        <button id="levelButton">Level Up</button>
    </div>
    
</body>
</html>
